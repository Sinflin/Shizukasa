<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- soft mist band -->
  <rect x="0" y="150" width="700" height="40" fill="#FBF9F3" opacity="0.5"/>

  <!-- back ridge, faintest -->
  <path d="M 0 190 C 60 150, 130 160, 190 130 C 250 100, 300 140, 360 120
           C 420 100, 470 135, 530 115 C 590 95, 640 130, 700 110 L 700 340 L 0 340 Z"
        fill="#C9C2AE" opacity="0.28"/>

  <!-- mid ridge -->
  <path d="M 0 230 C 70 190, 120 210, 180 175 C 240 140, 290 190, 350 165
           C 410 140, 460 185, 520 160 C 580 135, 630 175, 700 150 L 700 340 L 0 340 Z"
        fill="#B7AF97" opacity="0.35"/>

  <!-- front ridge, darkest -->
  <path d="M 0 270 C 80 235, 140 255, 210 220 C 280 185, 330 235, 400 210
           C 470 185, 520 225, 590 200 C 630 185, 665 200, 700 190 L 700 340 L 0 340 Z"
        fill="#8E9A88" opacity="0.4"/>

  <!-- a single distant bird, echoing quiet negative space -->
  <path d="M 560 60 Q 566 54 572 60 Q 578 54 584 60" fill="none"
        stroke="#A79E8C" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
</svg>
